import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
  id 'java-library'
  id 'maven-publish'
  alias libs.plugins.spotless
  // Puts Besu's BOM and every artifact Besu ships on compileOnly/testImplementation, and builds the
  // plugin distribution zip (distZip) with only the jars Besu does not already provide.
  // https://github.com/Consensys-Incorporated/besu-plugin-gradle-plugin
  alias libs.plugins.besu.plugin.distribution
  alias libs.plugins.errorprone
}

def targetBesuVersion = providers.gradleProperty('besuVersion').orElse(libs.versions.besu.asProvider()).get()

repositories {
  // Besu builds published locally with `./gradlew publishToMavenLocal` (see README.md), needed
  // until a Besu release contains the plugin API this plugin uses. Only Besu artifacts are taken
  // from it. The besu-plugin-distribution plugin adds Besu's own Maven repository.
  mavenLocal {
    content { includeGroupAndSubgroups 'org.hyperledger.besu' }
  }
  mavenCentral()
}

besuPlugin {
  besuVersion = targetBesuVersion
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  withSourcesJar()
  withJavadocJar()
}

dependencies {
  // Everything else the main code uses (plugin API, datatypes, Vert.x, Jackson, Guava, picocli,
  // Tuweni, SLF4J, auto-service) is provided by Besu and added to compileOnly by besuPlugin.
  // graphql-java is not: Besu no longer ships it once its core GraphQL service is removed.
  implementation libs.graphql.java
  implementation libs.java.dataloader

  errorprone libs.errorprone.core
  // https://github.com/besu-eth/besu-errorprone-checks
  errorprone libs.besu.errorprone.checks

  // Versions come from the Besu BOM. The Besu modules (core services, BlockchainSetupUtil from the
  // besu-ethereum-core test-support jar, BlockTestUtil and the test chains from besu-testutil) are
  // added to testImplementation by besuPlugin.
  testImplementation 'com.squareup.okhttp3:okhttp'
  testImplementation 'io.netty:netty-handler'
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.bouncycastle:bcpkix-jdk18on'
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Same compiler checks as Besu.
tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += [
    '-Xlint:unchecked',
    '-Xlint:cast',
    '-Xlint:rawtypes',
    '-Xlint:overloads',
    '-Xlint:divzero',
    '-Xlint:finally',
    '-Xlint:static',
    '-Werror',
  ]
  options.encoding = 'UTF-8'
  options.errorprone {
    disableWarningsInGeneratedCode = true
    // Our equals need to be symmetric, this checker doesn't respect that.
    check('EqualsGetClass', CheckSeverity.OFF)
    // We like to use futures with no return values.
    check('FutureReturnValueIgnored', CheckSeverity.OFF)
    // We use the JSR-305 annotations instead of the Google annotations.
    check('ImmutableEnumChecker', CheckSeverity.OFF)
    // This is a style check instead of an error-prone pattern.
    check('UnnecessaryParentheses', CheckSeverity.OFF)
    // This check is broken after Java 12. See https://github.com/google/error-prone/issues/1352
    check('TypeParameterUnusedInFormals', CheckSeverity.OFF)
    // The GraphQL schema exposes a transaction's type as its ordinal, as Besu does.
    check('EnumOrdinal', CheckSeverity.OFF)
    // Necessary for usages of CompletableFuture<Void>.
    check('VoidUsed', CheckSeverity.OFF)
    check('FieldCanBeFinal', CheckSeverity.WARN)
    check('InsecureCryptoUsage', CheckSeverity.WARN)
    check('WildcardImport', CheckSeverity.WARN)
  }
}

javadoc {
  options.addBooleanOption('Xdoclint:all', true)
  options.addStringOption('Xwerror', '-html5')
  options.encoding = 'UTF-8'
}

tasks.named('jar') {
  // Besu's distribution bundles the jar without the zip, so the jar has the license and notices too.
  into('META-INF') {
    from 'LICENSE', 'NOTICE'
  }
  manifest {
    attributes(
      'Implementation-Title': project.name,
      'Implementation-Version': project.version,
      'Besu-Version': targetBesuVersion,
      )
  }
}

tasks.named('test') {
  useJUnitPlatform()
  maxHeapSize = '4g'
  jvmArgs += [
    // Mockito and jackson-databind do some strange reflection during tests.
    '--add-opens',
    'java.base/java.util=ALL-UNNAMED',
    '--add-opens',
    'java.base/java.util.concurrent=ALL-UNNAMED',
    '--add-opens',
    'java.base/java.util.concurrent.atomic=ALL-UNNAMED',
    // RocksDB and JNA load native libraries in the end-to-end tests.
    '--enable-native-access=ALL-UNNAMED',
  ]
  testLogging {
    events = ['failed']
    exceptionFormat = 'full'
  }
}

// Integration tests: install the plugin distribution into a real Besu installation and run it.
// Needs -PbesuHome=<unpacked Besu distribution> (or BESU_HOME); skipped otherwise. Not part of check.
sourceSets {
  integrationTest {
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
  }
}

configurations {
  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

def besuHomeUnderTest = providers.gradleProperty('besuHome').orElse(providers.environmentVariable('BESU_HOME'))

tasks.register('integrationTest', Test) {
  description = 'Runs the plugin distribution in the Besu installation given by -PbesuHome.'
  group = 'verification'
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  useJUnitPlatform()
  def zip = tasks.named('distZip').flatMap { it.archiveFile }
  inputs.file(zip)
  systemProperty 'plugin.distribution', zip.get().asFile.absolutePath
  if (besuHomeUnderTest.isPresent()) {
    systemProperty 'besu.home.under.test', file(besuHomeUnderTest.get()).absolutePath
  }
  // Always re-run: the Besu installation is not tracked by Gradle.
  outputs.upToDateWhen { false }
  testLogging {
    events = ['passed', 'skipped', 'failed']
    exceptionFormat = 'full'
  }
}

// The plugin always ships graphql-java and java-dataloader in its distribution. Besu versions that
// still have their own GraphQL service also ship them, so besuPlugin would treat them as provided by
// Besu and leave them out; but the same zip must also work on (and be bundled with) Besu versions
// that no longer ship them. When Besu does provide them, Besu's copy is loaded first. Their other
// runtime dependencies (reactive-streams, jspecify) are provided by every Besu, GraphQL or not.
def alwaysShipped = [
  'com.graphql-java:graphql-java',
  'com.graphql-java:java-dataloader',
]
tasks.named('resolveBesuProvidedDependencies') {
  inputs.property('alwaysShipped', alwaysShipped)
  doLast {
    def file = besuProvidedDependenciesFile.get().asFile
    file.text = file.readLines().findAll { !alwaysShipped.contains(it.trim()) }.collect { it + '\n' }.join('')
  }
}

// The plugin is distributed as a zip only, with its license and the notices of the libraries it ships.
tasks.named('distTar') {
  enabled = false
}

distributions {
  main {
    contents {
      from 'LICENSE', 'NOTICE'
    }
  }
}

def verifyDistribution = tasks.register('verifyDistribution') {
  description = 'Verifies that the plugin distribution contains the plugin jar, graphql-java and its license, and no jar Besu provides.'
  group = 'verification'
  def zip = tasks.named('distZip').flatMap { it.archiveFile }
  def providedFile = tasks.named('resolveBesuProvidedDependencies').flatMap { it.besuProvidedDependenciesFile }
  def runtimeArtifacts = configurations.runtimeClasspath.incoming.artifacts
  inputs.file(zip)
  inputs.file(providedFile)
  doLast {
    def entries = new java.util.zip.ZipFile(zip.get().asFile).withCloseable { z -> z.entries().collect { it.name.tokenize('/').last() } }
    def required = [
      ~/besu-graphql-plugin-.*\.jar/,
      ~/graphql-java-.*\.jar/,
      ~/java-dataloader-.*\.jar/,
      ~/LICENSE/,
      ~/NOTICE/
    ]
    required.each { pattern ->
      if (!entries.any { it ==~ pattern }) {
        throw new GradleException("Plugin distribution ${zip.get().asFile} has no entry matching ${pattern}: ${entries}")
      }
    }
    // Besu's own artifacts are never on the runtime class path, and must never be shipped.
    def unexpected = entries.findAll { it ==~ /(besu-.*|plugin-api|datatypes|evm)-[0-9].*\.jar/ && !(it ==~ /besu-graphql-plugin-.*\.jar/) }
    // Neither must any library that the targeted Besu provides (besuPlugin's list, without the
    // libraries the plugin always ships, see alwaysShipped): Besu loads its own copy first.
    def provided = providedFile.get().asFile.readLines()*.trim().findAll { it } as Set
    runtimeArtifacts.artifacts.each { artifact ->
      def id = artifact.id.componentIdentifier
      if (id instanceof ModuleComponentIdentifier && provided.contains("${id.group}:${id.module}".toString())
      && entries.contains(artifact.file.name)) {
        unexpected << artifact.file.name
      }
    }
    if (!unexpected.isEmpty()) {
      throw new GradleException("Plugin distribution contains jars that Besu provides: ${unexpected}")
    }
  }
}

// The main code may use only Besu's plugin API and the types it exposes, never Besu internals: the
// plugin is loaded by a class loader that sees all of Besu, so internals would compile, pass the
// tests and work, until Besu changes them. The tests may use Besu internals.
def verifyPluginApiOnly = tasks.register('verifyPluginApiOnly') {
  description = 'Verifies that the main code uses only the Besu plugin API, not Besu internals.'
  group = 'verification'
  def sources = fileTree('src/main/java') { include '**/*.java' }
  // Propose an addition here only with a review of the Besu types concerned (see CONTRIBUTING.md).
  def allowed = [
    'org.hyperledger.besu.plugin',
    'org.hyperledger.besu.plugins.graphql',
    'org.hyperledger.besu.datatypes',
    // EVM types exposed by the plugin API (WorldStateService, TransactionSimulationService)
    'org.hyperledger.besu.evm.account',
    'org.hyperledger.besu.evm.worldstate',
    'org.hyperledger.besu.evm.tracing',
  ]
  inputs.files(sources)
  inputs.property('allowed', allowed)
  doLast {
    def violations = []
    sources.files.sort().each { file ->
      file.readLines().eachWithIndex { line, index ->
        (line =~ /org\.hyperledger\.besu\.[A-Za-z0-9_.]*[A-Za-z0-9_]/).each { String reference ->
          if (!allowed.any { reference == it || reference.startsWith(it + '.') }) {
            violations << "${file}:${index + 1}: ${reference}"
          }
        }
      }
    }
    if (!violations.isEmpty()) {
      throw new GradleException("The main code may only use Besu's plugin API (see CONTRIBUTING.md, \"Plugin API only\"):\n  " + violations.join('\n  '))
    }
  }
}

// The compatibility table of the README documents the Besu version the plugin is built against:
// its first row, the current version of the plugin, must name it.
def verifyReadmeBesuVersion = tasks.register('verifyReadmeBesuVersion') {
  description = 'Verifies that the first row of the README compatibility table names the Besu version from gradle/libs.versions.toml.'
  group = 'verification'
  def expected = libs.versions.besu.asProvider().get()
  def readmeFile = layout.projectDirectory.file('README.md').asFile
  inputs.file(readmeFile)
  inputs.property('expectedVersion', expected)
  doLast {
    def lines = readmeFile.readLines()
    def header = lines.findIndexOf { it.startsWith('| Plugin version |') }
    def row = header >= 0 && header + 2 < lines.size() ? lines[header + 2] : null
    def cells = row?.startsWith('|') ? row.split(/\|/)*.trim().findAll { it } : []
    if (cells.size() < 2 || !cells[1].contains("`${expected}`")) {
      throw new GradleException(
      "The first row of the compatibility table in README.md must name, in its second column, the Besu version `${expected}`" +
      " from gradle/libs.versions.toml: ${row}")
    }
  }
}

tasks.named('check') {
  dependsOn verifyDistribution, verifyReadmeBesuVersion, verifyPluginApiOnly
}

publishing {
  publications {
    maven(MavenPublication) {
      artifactId = project.name
      from components.java
      // The installable plugin distribution: unzip it into Besu's plugins directory.
      artifact(tasks.named('distZip'))
      versionMapping {
        allVariants {
          fromResolutionResult()
        }
      }
      pom {
        // The distribution zip is a second unclassified artifact; the main artifact is the jar.
        packaging = 'jar'
        name = 'Besu GraphQL plugin'
        description = 'EIP-1767 GraphQL API for Hyperledger Besu, as a Besu plugin.'
        url = 'https://github.com/jflo/besu-graphql-plugin'
        licenses {
          license {
            name = 'Apache License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }
        scm {
          url = 'https://github.com/jflo/besu-graphql-plugin'
          connection = 'scm:git:https://github.com/jflo/besu-graphql-plugin.git'
        }
        // besuPlugin pins the Besu BOM as an enforced platform for the build; consumers must not
        // inherit it, as the Besu that loads the plugin decides those versions.
        withXml {
          def root = asNode()
          root.dependencyManagement.each { root.remove(it) }
          root.dependencies.dependency.findAll { it.artifactId.text() == 'bom' }.each { it.parent().remove(it) }
        }
      }
    }
  }
}

// The Gradle module metadata would carry the enforced Besu BOM; publish the POM only.
tasks.withType(GenerateModuleMetadata).configureEach {
  enabled = false
}

spotless {
  java {
    target 'src/**/*.java'
    removeUnusedImports()
    googleJavaFormat(libs.versions.google.java.format.get())
    importOrder 'org.hyperledger', 'java', ''
    trimTrailingWhitespace()
    endWithNewline()
    // Same license header rules as Besu: files keep the header they were written with.
    licenseHeaderFile("${rootDir}/gradle/spotless/java.former.license").named("older").onlyIfContentMatches("^/\\*\\r?\\n.*Copyright ConsenSys AG\\.")
    licenseHeaderFile("${rootDir}/gradle/spotless/java.former.date.license").named("older.year").onlyIfContentMatches("^/\\*\\r?\\n.* Copyright \\d{4} ConsenSys AG\\.")
    licenseHeaderFile("${rootDir}/gradle/spotless/java.current.license").named("current").onlyIfContentMatches("^(?!/\\*\\r?\\n \\*.*(ConsenSys AG|Hyperledger Besu)\\.)")
  }
  groovyGradle {
    target '*.gradle'
    leadingTabsToSpaces(2)
    trimTrailingWhitespace()
    endWithNewline()
  }
}
