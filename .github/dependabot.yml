# Update pull requests for the GitHub Actions and the libraries the plugin ships itself
# (graphql-java, java-dataloader) and builds with. Besu's own artifacts and BOM follow the Besu
# version in gradle/libs.versions.toml, which maintainers bump for each Besu release
# (MAINTAINERS.md, "Release cadence").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "org.hyperledger.besu*"
      # graphql-java and java-dataloader stay at the versions Besu's own GraphQL service uses until
      # the plugin's minimum Besu no longer has that service (its BOM pins them, so an update here
      # would not change what is built), see CONTRIBUTING.md, "graphql-java".
      - dependency-name: "com.graphql-java:*"
