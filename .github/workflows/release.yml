name: Release

# Pushing a tag X.Y.Z (the plugin version, see RELEASING in README.md) builds and tests that
# version and publishes a GitHub release with the plugin distribution zip and jar. JitPack builds
# the Maven artifacts com.github.jflo:besu-graphql-plugin:X.Y.Z from the same tag on first request.
on:
  push:
    tags: [ '[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

    - name: Check the release prerequisites
      run: |
        besu="$(sed -nE 's/^besu *= *"([^"]+)".*/\1/p' gradle/libs.versions.toml)"
        if [[ "$besu" == *-SNAPSHOT ]]; then
          echo "::error::The plugin is built against Besu $besu, which is not released. Point gradle/libs.versions.toml at a Besu release first."
          exit 1
        fi
        if ! grep -q "^## ${GITHUB_REF_NAME}\b" CHANGELOG.md; then
          echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section."
          exit 1
        fi

    - name: Prepare Besu
      id: besu
      run: echo "home=$(scripts/prepare-besu.sh | tail -n 1)" >> "$GITHUB_OUTPUT"

    - name: Build
      run: ./gradlew build -Pversion="${GITHUB_REF_NAME}"

    - name: Integration tests
      run: ./gradlew integrationTest -Pversion="${GITHUB_REF_NAME}" -PbesuHome="${{ steps.besu.outputs.home }}"

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        awk -v tag="## ${GITHUB_REF_NAME}" '$0 ~ "^"tag"( |$)" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > release-notes.md
        gh release create "${GITHUB_REF_NAME}" \
          --verify-tag \
          --title "${GITHUB_REF_NAME}" \
          --notes-file release-notes.md \
          $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease) \
          build/distributions/besu-graphql-plugin-${GITHUB_REF_NAME}.zip \
          build/libs/besu-graphql-plugin-${GITHUB_REF_NAME}.jar
