name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # Builds and publishes Besu locally while the plugin targets an unreleased (-SNAPSHOT) Besu,
    # otherwise downloads the released Besu distribution for the integration tests.
    - name: Prepare Besu
      id: besu
      # bash runs with -e and pipefail, so a failure of the script fails the step
      shell: bash
      run: |
        home="$(scripts/prepare-besu.sh | tail -n 1)"
        test -x "$home/bin/besu"
        echo "home=$home" >> "$GITHUB_OUTPUT"

    # spotless, errorprone, javadoc, unit and end-to-end tests, distribution checks
    - name: Build
      run: ./gradlew build

    - name: Integration tests
      run: ./gradlew integrationTest -PbesuHome="${{ steps.besu.outputs.home }}"

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-reports
        path: build/reports/tests/
        retention-days: 7

    - name: Upload plugin distribution
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: besu-graphql-plugin
        path: build/distributions/*.zip
        retention-days: 7
