# Maven coordinates of the plugin. The release workflow overrides the version with -Pversion=<tag>,
# and JitPack overrides both with -Pgroup/-Pversion. The group changes when the repository is
# transferred (see MAINTAINERS.md).
group=com.github.jflo
version=0.1.0-SNAPSHOT

org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g

# Where scripts/prepare-besu.sh (and CI) builds Besu from while `besu` in gradle/libs.versions.toml is
# a -SNAPSHOT version, i.e. until a Besu release contains the plugin API from besu-eth/besu#11744.
# A commit, not a branch, so that the plugin API the plugin is built against only changes with this
# file: the head of besu-eth/besu#11744 (GitHub serves a pull request's commits from the base
# repository, even from a fork).
besuSnapshotRepository=https://github.com/besu-eth/besu.git
besuSnapshotCommit=f417ae0e6d0766479bcae9aee7d954d0508acd35
